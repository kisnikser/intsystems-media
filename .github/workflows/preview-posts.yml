name: Preview posts

# Render each added or changed draft in posts/ and send it to the editor in Telegram,
# exactly as the channel will show it, with approval buttons (worker/index.js).
on:
  push:
    branches: [main]
    paths: ["posts/**.md"]
  workflow_dispatch:
    inputs:
      post:
        description: Post file, e.g. posts/2026-10-27-mipt-conference.md
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Full TeX Live, the same year as local builds; Open Sans comes with it.
    container: texlive/texlive:latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_EDITOR_ID: ${{ vars.TELEGRAM_EDITOR_ID }}
      INPUT_POST: ${{ inputs.post }}
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq git poppler-utils python3 >/dev/null
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find drafts
        id: drafts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$INPUT_POST" ]; then
            files="$INPUT_POST"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'posts/*.md' | grep -vx 'posts/template.md' || true)
          fi
          drafts=$(for f in $files; do grep -qx 'status: draft' "$f" && echo "$f"; done || true)
          echo "files=$(echo $drafts)" >> "$GITHUB_OUTPUT"
          echo "Drafts: ${drafts:-none}"
      - name: Render and send
        if: steps.drafts.outputs.files != ''
        env:
          FILES: ${{ steps.drafts.outputs.files }}
        run: python3 scripts/send_post.py preview $FILES
