name: Draft post

# Turn a post the editor sent to the bot into a draft: Workers AI proposes the header,
# the text stays as written. Commit it and send the preview. Dispatched by worker/index.js.
on:
  workflow_dispatch:
    inputs:
      caption:
        description: Post text in Telegram HTML
        required: true

concurrency: posts-main

jobs:
  draft:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_EDITOR_ID: ${{ vars.TELEGRAM_EDITOR_ID }}
      CAPTION: ${{ inputs.caption }}
    steps:
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq git poppler-utils python3 curl >/dev/null
      - uses: actions/checkout@v4
      - name: Draft, commit, preview
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/draft_post.py "$CAPTION"
      - name: Tell the editor it failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
          -d chat_id="$TELEGRAM_EDITOR_ID" --data-urlencode text="⚠️ Draft failed: $RUN_URL"
